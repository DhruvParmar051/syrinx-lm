# Stock lm-eval `arc_easy` (0.4.13) on the pinned local file (docs/data.md, EXP-016).
task: syrinx_arc_easy
dataset_path: json
dataset_kwargs:
  data_files:
    test: data_cache/benchmarks/arc_easy.jsonl
output_type: multiple_choice
test_split: test
doc_to_text: "Question: {{question}}\nAnswer:"
doc_to_target: "{{choices.label.index(answerKey)}}"
doc_to_choice: "{{choices.text}}"
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
  - metric: acc_norm
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
