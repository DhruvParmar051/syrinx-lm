# Stock lm-eval `piqa` (0.4.13) on the pinned local file (docs/data.md, EXP-016). The stock task
# loads `baber/piqa`; this uses the `ybisk/piqa` parquet conversion that was contamination-checked.
task: syrinx_piqa
dataset_path: json
dataset_kwargs:
  data_files:
    validation: data_cache/benchmarks/piqa.jsonl
output_type: multiple_choice
validation_split: validation
test_split: null
doc_to_text: "Question: {{goal}}\nAnswer:"
doc_to_target: label
doc_to_choice: "{{[sol1, sol2]}}"
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
  - metric: acc_norm
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
